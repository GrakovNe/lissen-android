name: Instrumented Tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    runs-on: self-hosted
    timeout-minutes: 120
    #runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Ensure emulator packages
        run: |
          # The runner keeps a pre-provisioned SDK at /opt/android-sdk that is
          # not writable by the runner user, and its tools are not on PATH.
          # Locate the binaries by path, install only what is genuinely
          # missing, then export ANDROID_HOME/PATH for the following steps.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK/emulator/emulator" ] || [ ! -x "$SDK/platform-tools/adb" ] ||
             [ ! -d "$SDK/system-images/android-34/google_apis/x86_64" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Build test APKs
        run: >
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          :app:assembleMinified :minifiedTest:assembleMinified
          -Proom.schemaLocation=$GITHUB_WORKSPACE/app/schemas

      # The daemons would otherwise sit on their heap through the emulator phase.
      - name: Stop Gradle daemons
        run: ./gradlew --stop

      - name: Run instrumented tests on emulator fleet
        run: ./scripts/ci-instrumented-parallel.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: instrumented-test-results
          path: build/instrumented-results/
