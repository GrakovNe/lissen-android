name: Instrumented Tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    runs-on: self-hosted
    timeout-minutes: 120
    #runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Ensure emulator packages
        run: |
          # The runner SDK (/opt/android-sdk) is pre-provisioned and not
          # writable by the runner user; only install what is genuinely
          # missing so an available update never fails on permissions.
          missing=0
          [ -x "$ANDROID_HOME/emulator/emulator" ] || missing=1
          command -v adb >/dev/null || missing=1
          [ -d "$ANDROID_HOME/system-images/android-34/google_apis/x86_64" ] || missing=1
          if [ "$missing" = "1" ]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64"
          fi

      - name: Build test APKs
        run: >
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          :app:assembleMinified :minifiedTest:assembleMinified
          -Proom.schemaLocation=$GITHUB_WORKSPACE/app/schemas

      - name: Run instrumented tests on emulator fleet
        run: ./scripts/ci-instrumented-parallel.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: instrumented-test-results
          path: build/instrumented-results/
