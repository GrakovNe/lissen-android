name: Instrumented Tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  instrumented-tests:
    runs-on: self-hosted
    #runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Proom.schemaLocation=$GITHUB_WORKSPACE/app/schemas
            ./gradlew :app:assembleMinified :minifiedTest:assembleMinified
            adb install -r app/build/outputs/apk/minified/app-minified.apk
            adb install -r -t minifiedTest/build/outputs/apk/minified/minifiedTest-minified.apk
            mkdir -p minifiedTest/build/outputs/androidTest-results
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb logcat -c || true
            adb logcat -v threadtime ActivityManager:I ActivityTaskManager:I am_kill:V am_anr:V am_crash:V AndroidRuntime:E System.err:V LissenE2E:V "*":S > minifiedTest/build/outputs/androidTest-results/minified-logcat.txt &
            LOGCAT_PID=$!
            adb shell am instrument -w org.grakovne.lissen.minifiedtest/androidx.test.runner.AndroidJUnitRunner | tee minifiedTest/build/outputs/androidTest-results/minified.txt
            adb exec-out screencap -p > minifiedTest/build/outputs/androidTest-results/minified-screen.png || true
            adb pull /sdcard/Android/data/org.grakovne.lissen.minifiedtest/files/ minifiedTest/build/outputs/androidTest-results/e2e-dumps/ || true
            kill $LOGCAT_PID || true
            grep -Eq '^OK \([1-9][0-9]* tests?\)$' minifiedTest/build/outputs/androidTest-results/minified.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: instrumented-test-results
          path: |
            app/build/outputs/androidTest-results/
            minifiedTest/build/outputs/androidTest-results/
